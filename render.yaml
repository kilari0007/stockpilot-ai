databases:
  - name: kilari-stockpilot-db
    plan: free
    databaseName: stockpilot
    user: stockpilot

services:
  - type: web
    name: kilari-stockpilot-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -e .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kilari-stockpilot-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "*"

  - type: web
    name: kilari-stockpilot-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://kilari-stockpilot-api.onrender.com
